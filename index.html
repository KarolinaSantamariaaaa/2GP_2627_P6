<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P6_display_flex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
     *{
      padding: 0;
      margin: 0; 
      box-sizing: border-box;
      }

     :root{
      --primary-color: #F75D6F;
      --secondary-color: #837AFF;
      --terciary-color:  #5BE490;
      }

    .redaction-50-regular {
      font-family: "Redaction 50", serif;
      font-weight: 400;
      font-style: normal;
    }

    .container{
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: row;
    }

    .container section:first-child, .container section:nth-child(3) {
        width: 20%;
    }
    .container section:nth-child(2) {
        width: 70%;
    }

    #rojo{
        background-color: var(--primary-color);
        height: 100%;
        width: 100%;
    }
    #azul{
        background-color: var(--secondary-color);
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        color: white;
    }
    section div{
        display: flex;
        flex-direction: row;
        align-items: center;
    }
    section div:last-child{
        align-items: end;
        padding-right: 50px;
    }
    #verde{
        background-color: var(--terciary-color);
        height: 100%;
    }

    </style>
</head>
<body>
<div class="container">
    <section> 
        <div id="rojo"></div>
    </section>
    <section id="azul">
        <div class="redaction-50-regular">
            <h1>Hola</h1>
        </div>
        <div class="redaction-50-regular">
            <h1>Bye</h1>
        </div>
    </section>
    <section> 
        <div id="verde"></div>
    </section>
</div>
</body>
</html>
